<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChainBreaker intro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f17; color: #e5e7eb; font-family: Inter, system-ui, sans-serif; }
    body { display: grid; place-items: center; overflow: hidden; }
    .wrap { text-align: center; max-width: 1100px; padding: 0 60px; animation: rise 1s ease-out both; }
    .logo { font-size: 96px; font-weight: 800; letter-spacing: -.02em; }
    .logo b { color: #ef4444; }
    .chain { color: #ef4444; margin-right: 18px; }
    .line { margin-top: 28px; font-size: 34px; line-height: 1.35; color: #cbd5e1; animation: rise 1s .35s ease-out both; }
    .foot { position: fixed; bottom: 48px; left: 0; right: 0; text-align: center; font: 600 20px/1 "JetBrains Mono", monospace;
            color: #22d3ee; letter-spacing: .04em; animation: fade 1s .8s both; }
    .glow { position: fixed; inset: 0; background: radial-gradient(800px 400px at 50% 45%, rgba(239,68,68,.12), transparent 70%); }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="logo"><span class="chain">⛓</span>Chain<b>Breaker</b></div>
    <div class="line">When a GitHub Action gets hacked, find every pipeline that runs it, and fix them in the fewest moves.</div>
  </div>
  <div class="foot">Graph Hacks · Track 01 · Built on FalkorDB</div>
</body>
</html>
