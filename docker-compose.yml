services:
  falkordb:
    image: falkordb/falkordb:latest
    environment:
      - REDIS_ARGS=--requirepass ${FALKORDB_PASSWORD:-chainbreaker} --appendonly yes
      # image default is TIMEOUT 1000 (ms) + RESULTSET_SIZE 10000, too small for the CNCF graph
      - FALKORDB_ARGS=MAX_QUEUED_QUERIES 25 TIMEOUT_DEFAULT 60000 TIMEOUT_MAX 300000 RESULTSET_SIZE -1
    ports: ["127.0.0.1:6379:6379", "127.0.0.1:3000:3000"]
    volumes: ["falkordb_data:/var/lib/falkordb/data"]
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-chainbreaker}
    depends_on: [falkordb]
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
  caddy:
    image: caddy:2
    profiles: ["prod"]
    ports: ["80:80", "443:443"]
    environment: ["DOMAIN=${DOMAIN}"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", "caddy_data:/data"]
    depends_on: [app]
    restart: unless-stopped
volumes: { falkordb_data: {}, caddy_data: {} }
